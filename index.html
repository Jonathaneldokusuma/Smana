<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigasi Ambulans Cerdas</title>
    <meta name="description" content="Navigasi ambulans berbasis lokasi realtime." />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <div id="map"></div>
      <div class="zoom-stack" aria-label="Kontrol zoom">
        <button class="zoom-btn" id="zoomInBtn" aria-label="Zoom in">+</button>
        <button class="zoom-btn" id="zoomOutBtn" aria-label="Zoom out">-</button>
      </div>
      <div class="hud">
        <button class="hud-btn" id="centerBtn">Pusatkan</button>
        <button class="hud-btn" id="locBtn">Lokasi saya</button>
        <button class="hud-btn" id="caseBtn">Pilih kondisi</button>
        <span class="hud-pill" id="statusPill">Mencari lokasi...</span>
      </div>
      <div class="geo-error" id="geoError" hidden></div>
      <div class="case-modal" id="caseModal" hidden>
        <div class="case-card" role="dialog" aria-modal="true" aria-labelledby="caseTitle">
          <div class="case-head">
            <div>
              <p class="eyebrow">Prioritas pasien</p>
              <h2 id="caseTitle">Pilih kondisi pasien</h2>
            </div>
            <button class="case-close" id="caseCloseBtn" aria-label="Tutup">&times;</button>
          </div>
          <p class="case-copy">Kami akan cari rumah sakit terdekat yang paling cocok lalu buat rute otomatis.</p>
          <div class="case-grid" id="caseGrid"></div>
        </div>
      </div>
    </main>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script
      src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"
      crossorigin=""
    ></script>
    <script src="app.js"></script>
  </body>
</html>
