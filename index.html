<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigasi Ambulans Cerdas</title>
    <meta name="description" content="Navigasi ambulans berbasis lokasi realtime." />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <div id="map"></div>
      <div class="hud">
        <button class="hud-btn" id="centerBtn">Pusatkan</button>
        <button class="hud-btn" id="locBtn">Lokasi saya</button>
        <span class="hud-pill" id="statusPill">Mencari lokasi...</span>
      </div>
      <div class="geo-error" id="geoError" hidden></div>
    </main>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
  </body>
</html>
